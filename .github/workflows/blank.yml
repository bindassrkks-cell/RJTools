# .github/workflows/init-and-build.yml
name: Init Project & Build APK

on:
  workflow_dispatch:

jobs:
  init-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Resources, Assets & Source Files
        run: |
          # 1. Clean up old faulty mipmaps
          rm -rf app/src/main/res/mipmap-*

          # 2. Re-create directory structure
          mkdir -p app/src/main/java/com/rjtool/app/ui/screens
          mkdir -p app/src/main/java/com/rjtool/app/ui/theme
          mkdir -p app/src/main/java/com/rjtool/app/ui/components
          mkdir -p app/src/main/java/com/rjtool/app/utils
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # ---------- assets/index.csv ----------
          cat > app/src/main/assets/index.csv <<'EOF'
          Engine/Content/EngineMaterials/DefaultDiffuse_White.uexp
          Engine/Content/EngineMaterials/DefaultLightFunctionMaterial.uexp
          Engine/Content/EngineMaterials/DefaultMaterial.uexp
          Engine/Content/EngineMaterials/DefaultNormal.ubulk
          Engine/Content/EngineMaterials/DefaultNormal.uexp
          Engine/2.txt
          Engine/Config/Android/AndroidEngine.ini
          EOF

          # ---------- FileUtils.kt (Creates storage folders) ----------
          cat > app/src/main/java/com/rjtool/app/utils/FileUtils.kt <<'EOF'
          package com.rjtool.app.utils

          import android.content.Context
          import android.os.Environment
          import java.io.File
          import java.io.FileOutputStream

          object FileUtils {
              val ROOT_DIR = File(Environment.getExternalStorageDirectory(), "RJTOOL")

              fun initRJToolWorkspace(context: Context) {
                  if (!ROOT_DIR.exists()) ROOT_DIR.mkdirs()
                  val folders = listOf(
                      "EDITTED",
                      "LUA_ORIGINAL",
                      "LUA_UNPACK",
                      "PAK_ORIGINAL",
                      "PAK_UNPACK",
                      "RESULT_PAK"
                  )
                  folders.forEach { folderName ->
                      val dir = File(ROOT_DIR, folderName)
                      if (!dir.exists()) dir.mkdirs()
                  }

                  val targetCsv = File(ROOT_DIR, "index.csv")
                  if (!targetCsv.exists()) {
                      try {
                          context.assets.open("index.csv").use { input ->
                              FileOutputStream(targetCsv).use { output ->
                                  input.copyTo(output)
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }
          }
          EOF

          # ---------- TopHeader.kt ----------
          cat > app/src/main/java/com/rjtool/app/ui/components/TopHeader.kt <<'EOF'
          package com.rjtool.app.ui.components

          import androidx.compose.foundation.background
