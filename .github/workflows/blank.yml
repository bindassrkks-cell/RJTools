                  uri?.let { selectedFile = it.lastPathSegment?.substringAfterLast('/') ?: it.path }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFFF7F9FA))
                      .padding(horizontal = 20.dp, vertical = 16.dp)
              ) {
                  TopHeader()
                  Spacer(modifier = Modifier.height(20.dp))
                  Row(
                      modifier = Modifier
