# .github/workflows/init-and-build.yml
name: Init Project & Build APK

on:
  workflow_dispatch:   # manual trigger only

jobs:
  init-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create all source files
        run: |
          # Create directory structure
          mkdir -p app/src/main/java/com/rjtool/app/ui/screens
          mkdir -p app/src/main/java/com/rjtool/app/ui/theme
          mkdir -p app/src/main/java/com/rjtool/app/utils
          mkdir -p app/src/main/java/com/rjtool/app/data
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # ---------- MainActivity.kt ----------
          cat > app/src/main/java/com/rjtool/app/MainActivity.kt <<'EOF'
          package com.rjtool.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.ui.Modifier
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.rjtool.app.ui.screens.*
          import com.rjtool.app.ui.theme.RJTOOLTheme
          import dagger.hilt.android.AndroidEntryPoint

          @AndroidEntryPoint
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      RJTOOLTheme {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              val navController = rememberNavController()
                              NavHost(navController = navController, startDestination = "onboarding") {
                                  composable("onboarding") {
                                      OnboardingScreen(
                                          onAgree = {
                                              navController.navigate("home") {
                                                  popUpTo("onboarding") { inclusive = true }
                                              }
                                          }
                                      )
                                  }
                                  composable("home") {
                                      HomeScreen(
                                          onPAKUnpack = { navController.navigate("pak_unpack") },
                                          onPAKRepack = { navController.navigate("pak_repack") },
                                          onLUADecompile = { navController.navigate("lua_decompile") },
                                          onLUACompile = { navController.navigate("lua_compile") },
                                          onSizeFixer = { navController.navigate("size_fixer") },
                                          onHexEditor = { navController.navigate("hex_editor") }
                                      )
                                  }
                                  composable("pak_unpack") { PAKUnpackScreen(navController) }
                                  composable("pak_repack") { PAKRepackScreen(navController) }
                                  composable("lua_decompile") { LUADecompileScreen(navController) }
                                  composable("lua_compile") { LUACompileScreen(navController) }
                                  composable("size_fixer") { SizeFixerScreen(navController) }
                                  composable("hex_editor") { HexEditorScreen(navController) }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # ---------- HomeScreen.kt ----------
          cat > app/src/main/java/com/rjtool/app/ui/screens/HomeScreen.kt <<'EOF'
          package com.rjtool.app.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          data class ToolItem(
              val id: String,
              val title: String,
              val icon: ImageVector,
              val description: String,
              val color: Color
          )

          @Composable
          fun HomeScreen(
              onPAKUnpack: () -> Unit,
              onPAKRepack: () -> Unit,
              onLUADecompile: () -> Unit,
              onLUACompile: () -> Unit,
              onSizeFixer: () -> Unit,
              onHexEditor: () -> Unit
          ) {
              val tools = listOf(
                  ToolItem("pak_unpack", "PAK Unpack", Icons.Default.FolderOpen, "Extract PAK files", MaterialTheme.colorScheme.primary),
                  ToolItem("pak_repack", "PAK Repack", Icons.Default.Archive, "Repack to PAK", MaterialTheme.colorScheme.secondary),
                  ToolItem("lua_decompile", "LUA Decompile", Icons.Default.Code, "Bytecode → Lua source", MaterialTheme.colorScheme.tertiary),
                  ToolItem("lua_compile", "LUA Compile", Icons.Default.Build, "Lua source → bytecode", Color(0xFFFF9800)),
                  ToolItem("size_fixer", "Size Fixer", Icons.Default.FitScreen, "Fix file sizes", Color(0xFF4CAF50)),
                  ToolItem("hex_editor", "Hex Editor", Icons.Default.Edit, "Edit .uexp files", Color(0xFFF44336))
              )

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(text = "🔧 RJTOOL v1.0.59", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.onPrimaryContainer)
                          Text(text = "Storage: /storage/emulated/0/RJTOOL", fontSize = 14.sp, color = MaterialTheme.colorScheme.onPrimaryContainer.copy(alpha = 0.7f))
                          Text(text = "Storage access granted ✅", fontSize = 14.sp, color = Color(0xFF4CAF50))
                      }
                  }
                  Spacer(modifier = Modifier.height(16.dp))
                  Text(text = "Select Tool", fontSize = 18.sp, fontWeight = FontWeight.Medium)
                  Spacer(modifier = Modifier.height(8.dp))
                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(tools) { tool ->
                          Card(
                              modifier = Modifier.fillMaxWidth().aspectRatio(1.1f),
                              onClick = when (tool.id) {
                                  "pak_unpack" -> onPAKUnpack
                                  "pak_repack" -> onPAKRepack
                                  "lua_decompile" -> onLUADecompile
                                  "lua_compile" -> onLUACompile
                                  "size_fixer" -> onSizeFixer
                                  "hex_editor" -> onHexEditor
                                  else -> {}
                              },
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant),
                              elevation = CardDefaults.cardElevation(defaultElevation = 4.dp)
                          ) {
                              Column(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                                  Icon(imageVector = tool.icon, contentDescription = tool.title, tint = tool.color, modifier = Modifier.size(48.dp))
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(text = tool.title, fontSize = 16.sp, fontWeight = FontWeight.Bold, textAlign = androidx.compose.ui.text.style.TextAlign.Center)
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(text = tool.description, fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f), textAlign = androidx.compose.ui.text.style.TextAlign.Center)
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # ---------- OnboardingScreen.kt ----------
          cat > app/src/main/java/com/rjtool/app/ui/screens/OnboardingScreen.kt <<'EOF'
          package com.rjtool.app.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
