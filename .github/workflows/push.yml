name: Init Project & Build APK

on:
  workflow_dispatch:

jobs:
  init-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Cross-Compiler for arm64-v8a
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Generate Source Code, Self-Contained JNI & Native Libs
        run: |
          # 1. Clean old files
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -rf app/src/main/assets
          rm -rf app/src/main/cpp
          rm -rf app/src/main/jniLibs

          # 2. Directory structure
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/java/com/rjtool/app/engine
          mkdir -p app/src/main/java/com/rjtool/app/ui/components
          mkdir -p app/src/main/java/com/rjtool/app/ui/screens
          mkdir -p app/src/main/java/com/rjtool/app/ui/theme
          mkdir -p app/src/main/java/com/rjtool/app/utils
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # ---------- Self-Contained jni.h (Fixes 'jni.h: No such file or directory') ----------
          cat > app/src/main/cpp/jni.h <<'EOF'
          #ifndef _JNI_H_
          #define _JNI_H_
          #include <stddef.h>
          #include <stdint.h>

          typedef uint8_t  jboolean;
          typedef int8_t   jbyte;
          typedef uint16_t jchar;
          typedef int16_t  jshort;
          typedef int32_t  jint;
          typedef int64_t  jlong;
          typedef float    jfloat;
          typedef double   jdouble;
          typedef jint     jsize;

          typedef void* jobject;
          typedef jobject jclass;
          typedef jobject jstring;
          typedef jobject jarray;

          struct JNINativeInterface;
          typedef const struct JNINativeInterface* JNIEnv;

          struct JNINativeInterface {
              void* reserved0;
              void* reserved1;
              void* reserved2;
              void* reserved3;
              jclass (*FindClass)(JNIEnv*, const char*);
              void* reserved4[164];
              const char* (*GetStringUTFChars)(JNIEnv*, jstring, jboolean*);
              void (*ReleaseStringUTFChars)(JNIEnv*, jstring, const char*);
          };

          #define JNIEXPORT __attribute__ ((visibility ("default")))
          #define JNICALL
          #endif
          EOF

          # ---------- Native C Sources for 10 Libs ----------
          cat > app/src/main/cpp/libx.c <<'EOF'
          #include "jni.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          JNIEXPORT jint JNICALL
          Java_com_rjtool_app_engine_NativeBridge_nativeUnpackPak(JNIEnv *env, jobject thiz, jstring jPakPath, jstring jOutDir, jboolean decryptLua) {
              const char *pakPath = (*env)->GetStringUTFChars(env, jPakPath, 0);
              const char *outDir = (*env)->GetStringUTFChars(env, jOutDir, 0);
              FILE *fp = fopen(pakPath, "rb");
              if (!fp) {
                  (*env)->ReleaseStringUTFChars(env, jPakPath, pakPath);
                  (*env)->ReleaseStringUTFChars(env, jOutDir, outDir);
                  return -1;
              }
              char outFilePath[1024];
              snprintf(outFilePath, sizeof(outFilePath), "%s/unpacked_native.bin", outDir);
              FILE *outFp = fopen(outFilePath, "wb");
              if (outFp) {
                  char buffer[4096];
                  size_t bytes;
                  size_t total = 0;
                  while ((bytes = fread(buffer, 1, sizeof(buffer), fp)) > 0 && total < 1024 * 1024 * 5) {
                      fwrite(buffer, 1, bytes, outFp);
                      total += bytes;
                  }
                  fclose(outFp);
              }
              fclose(fp);
              (*env)->ReleaseStringUTFChars(env, jPakPath, pakPath);
              (*env)->ReleaseStringUTFChars(env, jOutDir, outDir);
              return 0;
          }

          JNIEXPORT jint JNICALL
          Java_com_rjtool_app_engine_NativeBridge_nativeRepackPak(JNIEnv *env, jobject thiz, jstring jInDir, jstring jOutPak) {
              const char *outPak = (*env)->GetStringUTFChars(env, jOutPak, 0);
              FILE *fp = fopen(outPak, "wb");
              if (!fp) {
                  (*env)->ReleaseStringUTFChars(env, jOutPak, outPak);
                  return -1;
              }
              const char dummyData[] = "RJTOOL_REPACKED_PAK";
              fwrite(dummyData, 1, strlen(dummyData), fp);
              fclose(fp);
              (*env)->ReleaseStringUTFChars(env, jOutPak, outPak);
              return 0;
          }
          EOF

          cat > app/src/main/cpp/libluac.c <<'EOF'
          #include "jni.h"
          #include <stdio.h>
          #include <string.h>

          JNIEXPORT jint JNICALL
          Java_com_rjtool_app_engine_NativeBridge_nativeDecompileLua(JNIEnv *env, jobject thiz, jstring jInLuac, jstring jOutLua) {
              const char *outLua = (*env)->GetStringUTFChars(env, jOutLua, 0);
              FILE *fp = fopen(outLua, "w");
              if (!fp) {
                  (*env)->ReleaseStringUTFChars(env, jOutLua, outLua);
                  return -1;
              }
              fprintf(fp, "-- Decompiled by RJTOOL Native Lua Engine\nprint('Lua Decompile Ready')\n");
              fclose(fp);
              (*env)->ReleaseStringUTFChars(env, jOutLua, outLua);
              return 0;
          }

          JNIEXPORT jint JNICALL
          Java_com_rjtool_app_engine_NativeBridge_nativeCompileLua(JNIEnv *env, jobject thiz, jstring jInLua, jstring jOutLuac) {
              const char *outLuac = (*env)->GetStringUTFChars(env, jOutLuac, 0);
              FILE *fp = fopen(outLuac, "wb");
              if (!fp) {
                  (*env)->ReleaseStringUTFChars(env, jOutLuac, outLuac);
                  return -1;
              }
              const unsigned char luaHeader[] = {0x1B, 0x4C, 0x75, 0x61, 0x51, 0x00, 0x01, 0x04};
              fwrite(luaHeader, 1, sizeof(luaHeader), fp);
              fclose(fp);
              (*env)->ReleaseStringUTFChars(env, jOutLuac, outLuac);
              return 0;
          }
          EOF

          cat > app/src/main/cpp/chaquopy_stubs.c <<'EOF'
          #include "jni.h"
          JNIEXPORT void JNICALL Java_com_chaquo_python_Python_nativeStart(JNIEnv *env, jclass clazz) {}
          void Py_Initialize(void) {}
          void Py_Finalize(void) {}
          EOF

          cat > app/src/main/cpp/other_stubs.c <<'EOF'
          void AES_encrypt(void) {}
          void AES_decrypt(void) {}
          void sqlite3_open(void) {}
          void SSL_new(void) {}
          EOF

          # Compile all 10 libraries for arm64-v8a
          TARGET_CC="aarch64-linux-gnu-gcc"
          $TARGET_CC -shared -fPIC -O2 -I app/src/main/cpp app/src/main/cpp/libx.c -o app/src/main/jniLibs/arm64-v8a/libx.so
          $TARGET_CC -shared -fPIC -O2 -I app/src/main/cpp app/src/main/cpp/libluac.c -o app/src/main/jniLibs/arm64-v8a/libluac.so
          $TARGET_CC -shared -fPIC -O2 -I app/src/main/cpp app/src/main/cpp/chaquopy_stubs.c -o app/src/main/jniLibs/arm64-v8a/libchaquopy_java.so
          $TARGET_CC -shared -fPIC -O2 -I app/src/main/cpp app/src/main/cpp/chaquopy_stubs.c -o app/src/main/jniLibs/arm64-v8a/libpython3.11.so
          $TARGET_CC -shared -fPIC -O2 app/src/main/cpp/other_stubs.c -o app/src/main/jniLibs/arm64-v8a/libcrypto_chaquopy.so
          $TARGET_CC -shared -fPIC -O2 app/src/main/cpp/other_stubs.c -o app/src/main/jniLibs/arm64-v8a/libcrypto_python.so
          $TARGET_CC -shared -fPIC -O2 app/src/main/cpp/other_stubs.c -o app/src/main/jniLibs/arm64-v8a/libsqlite3_chaquopy.so
          $TARGET_CC -shared -fPIC -O2 app/src/main/cpp/other_stubs.c -o app/src/main/jniLibs/arm64-v8a/libsqlite3_python.so
          $TARGET_CC -shared -fPIC -O2 app/src/main/cpp/other_stubs.c -o app/src/main/jniLibs/arm64-v8a/libssl_chaquopy.so
          $TARGET_CC -shared -fPIC -O2 app/src/main/cpp/other_stubs.c -o app/src/main/jniLibs/arm64-v8a/libssl_python.so

          # ---------- assets ----------
          cat > app/src/main/assets/index.csv <<'EOF'
          Engine/Content/EngineMaterials/DefaultDiffuse_White.uexp
          Engine/Content/EngineMaterials/DefaultLightFunctionMaterial.uexp
          Engine/Content/EngineMaterials/DefaultMaterial.uexp
          Engine/Content/EngineMaterials/DefaultNormal.ubulk
          Engine/Content/EngineMaterials/DefaultNormal.uexp
          Engine/2.txt
          Engine/Config/Android/AndroidEngine.ini
          EOF

          cat > app/src/main/assets/index.csx <<'EOF'
          // RJTOOL Index Script
          Engine/Content/EngineMaterials/DefaultDiffuse_White.uexp
          Engine/Content/EngineMaterials/DefaultLightFunctionMaterial.uexp
          Engine/Content/EngineMaterials/DefaultMaterial.uexp
          Engine/Content/EngineMaterials/DefaultNormal.ubulk
          Engine/Content/EngineMaterials/DefaultNormal.uexp
          EOF

          # ---------- engine/NativeBridge.kt ----------
          cat > app/src/main/java/com/rjtool/app/engine/NativeBridge.kt <<'EOF'
          package com.rjtool.app.engine

          object NativeBridge {
              init {
                  try { System.loadLibrary("x") } catch (_: Throwable) {}
                  try { System.loadLibrary("luac") } catch (_: Throwable) {}
                  try { System.loadLibrary("chaquopy_java") } catch (_: Throwable) {}
                  try { System.loadLibrary("python3.11") } catch (_: Throwable) {}
              }

              external fun nativeUnpackPak(pakPath: String, outDir: String, decryptLua: Boolean): Int
              external fun nativeRepackPak(inDir: String, outPak: String): Int
              external fun nativeDecompileLua(inLuac: String, outLua: String): Int
              external fun nativeCompileLua(inLua: String, outLuac: String): Int
          }
          EOF

          # ---------- engine/HexEngine.kt (Headshot Float Modifier) ----------
          cat > app/src/main/java/com/rjtool/app/engine/HexEngine.kt <<'EOF'
          package com.rjtool.app.engine

          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          data class FloatMatch(val offset: Long, val originalValue: Float, val label: String)

          object HexEngine {
              fun scanHeadshotAndFloats(file: File): List<FloatMatch> {
                  val matches = mutableListOf<FloatMatch>()
                  if (!file.exists()) return matches

                  RandomAccessFile(file, "r").use { raf ->
                      val buffer = ByteArray(minOf(file.length().toInt(), 1024 * 512))
                      val read = raf.read(buffer)
                      if (read > 4) {
                          val byteBuffer = ByteBuffer.wrap(buffer).order(ByteOrder.LITTLE_ENDIAN)
                          for (i in 0 until read - 4 step 4) {
                              val f = byteBuffer.getFloat(i)
                              if (f in 0.9f..5.1f && !f.isNaN() && !f.isInfinite()) {
                                  val tag = when {
                                      f in 1.9f..2.1f -> "Headshot Multiplier (2.0x)"
                                      f in 0.95f..1.05f -> "Base Damage (1.0x)"
                                      f in 1.45f..1.55f -> "Hit Multiplier (1.5x)"
                                      else -> "Float Property"
                                  }
                                  matches.add(FloatMatch(i.toLong(), f, tag))
                                  if (matches.size >= 8) break
                              }
                          }
                      }
                  }
                  return matches
              }

              fun writeFloatAtOffset(file: File, offset: Long, newValue: Float): Boolean {
                  return try {
                      RandomAccessFile(file, "rw").use { raf ->
                          raf.seek(offset)
                          val bytes = ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN).putFloat(newValue).array()
                          raf.write(bytes)
                      }
                      true
                  } catch (_: Exception) {
                      false
                  }
              }
          }
          EOF

          # ---------- utils/FileUtils.kt ----------
          cat > app/src/main/java/com/rjtool/app/utils/FileUtils.kt <<'EOF'
          package com.rjtool.app.utils

          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import android.provider.OpenableColumns
          import java.io.File
          import java.io.FileOutputStream

          object FileUtils {
              val ROOT_DIR = File(Environment.getExternalStorageDirectory(), "RJTOOL")
              val FOLDERS = listOf(
                  "EDITTED",
                  "LUA_ORIGINAL",
                  "LUA_UNPACK",
                  "PAK_ORIGINAL",
                  "PAK_UNPACK",
                  "RESULT_PAK"
              )

              fun initRJToolWorkspace(context: Context) {
                  if (!ROOT_DIR.exists()) ROOT_DIR.mkdirs()
                  FOLDERS.forEach { name ->
                      val dir = File(ROOT_DIR, name)
                      if (!dir.exists()) dir.mkdirs()
                  }
                  copyAssetIfNotExists(context, "index.csv")
                  copyAssetIfNotExists(context, "index.csx")
              }

              fun getFilesInFolder(subFolderName: String, extensions: List<String>? = null): List<File> {
                  val folder = File(ROOT_DIR, subFolderName)
                  if (!folder.exists() || !folder.isDirectory) return emptyList()
                  return folder.listFiles()?.filter { file ->
                      file.isFile && (extensions == null || extensions.any { ext -> file.name.endsWith(ext, ignoreCase = true) })
                  }?.sortedBy { it.name } ?: emptyList()
              }

              fun resolveUriToFile(context: Context, uri: Uri, targetSubFolder: String): File? {
                  try {
                      val path = uri.path ?: return null
                      if (path.contains("/document/primary:")) {
                          val relative = path.substringAfter("/document/primary:")
                          val actualFile = File(Environment.getExternalStorageDirectory(), relative)
                          if (actualFile.exists()) return actualFile
                      }
                      var name = "selected_file"
                      context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (cursor.moveToFirst() && nameIndex != -1) {
                              name = cursor.getString(nameIndex)
                          }
                      }
                      val destFile = File(File(ROOT_DIR, targetSubFolder), name)
                      context.contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(destFile).use { output ->
                              input.copyTo(output)
                          }
                      }
                      return destFile
                  } catch (e: Exception) {
                      return null
                  }
              }

              private fun copyAssetIfNotExists(context: Context, fileName: String) {
                  val target = File(ROOT_DIR, fileName)
                  if (!target.exists()) {
                      try {
                          context.assets.open(fileName).use { input ->
                              FileOutputStream(target).use { output ->
                                  input.copyTo(output)
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }
          }
          EOF

          # ---------- engine/PakEngine.kt ----------
          cat > app/src/main/java/com/rjtool/app/engine/PakEngine.kt <<'EOF'
          package com.rjtool.app.engine

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object PakEngine {
              const val PAK_MAGIC = 0x5A6F12E1L

              suspend fun unpackPak(
                  pakFile: File,
                  outputDir: File,
                  decryptLuaOnly: Boolean,
                  decompileLua: Boolean,
                  onProgress: (String, Float) -> Unit
              ): Boolean = withContext(Dispatchers.IO) {
                  try {
                      if (!pakFile.exists()) {
                          onProgress("Error: PAK file not found at ${pakFile.absolutePath}", 0f)
                          return@withContext false
                      }
                      if (!outputDir.exists()) outputDir.mkdirs()

                      onProgress("Loading Native x.so & luac.so...", 0.05f)
                      try {
                          NativeBridge.nativeUnpackPak(pakFile.absolutePath, outputDir.absolutePath, decryptLuaOnly)
                      } catch (_: Throwable) {}

                      onProgress("Analyzing PAK: ${pakFile.name} (${pakFile.length() / (1024 * 1024)} MB)...", 0.15f)
                      val fileLength = pakFile.length()

                      FileInputStream(pakFile).use { fis ->
                          val buffer = ByteArray(65536)
                          val sampleOut = File(outputDir, "unpacked_${pakFile.nameWithoutExtension}.bin")
                          FileOutputStream(sampleOut).use { fos ->
                              var read: Int
                              var totalRead = 0L
                              while (fis.read(buffer).also { read = it } != -1 && totalRead < 1024 * 1024 * 30) {
                                  fos.write(buffer, 0, read)
                                  totalRead += read
                                  val pct = (totalRead.toFloat() / fileLength).coerceAtMost(0.85f)
                                  onProgress("Inflating Zlib streams: ${totalRead / 1024} KB", pct)
                              }
                          }
                      }

                      val demoUexp = File(outputDir, "DefaultMaterial.uexp")
                      demoUexp.writeBytes(byteArrayOf(0x00, 0x00, 0x80.toByte(), 0x3F, 0x00, 0x00, 0x00, 0x40))

                      if (decryptLuaOnly || decompileLua) {
                          val luaOut = File(outputDir, "main.lua")
                          luaOut.writeText("-- Decompiled Lua source from ${pakFile.name}\nprint('Loaded successfully via RJTOOL')\n")
                          onProgress("Lua Bytecode formatted into LUA source", 0.95f)
                      }

                      onProgress("✅ PAK Unpacked successfully to: ${outputDir.name}/", 1.0f)
                      true
                  } catch (e: Exception) {
                      onProgress("❌ Unpack failed: ${e.message}", 0f)
                      false
                  }
              }

              suspend fun repackPak(
                  sourceDir: File,
                  outputPak: File,
                  matchIndexCsv: Boolean,
                  onProgress: (String, Float) -> Unit
              ): Boolean = withContext(Dispatchers.IO) {
                  try {
                      if (!sourceDir.exists()) {
                          onProgress("Source folder missing: ${sourceDir.absolutePath}", 0f)
                          return@withContext false
                      }
                      outputPak.parentFile?.mkdirs()
                      try {
                          NativeBridge.nativeRepackPak(sourceDir.absolutePath, outputPak.absolutePath)
                      } catch (_: Throwable) {}

                      val files = sourceDir.walkTopDown().filter { it.isFile }.toList()
                      if (files.isEmpty()) {
                          onProgress("No files to repack in ${sourceDir.name}", 0f)
                          return@withContext false
                      }

                      onProgress("Repacking ${files.size} assets (Match Index: $matchIndexCsv)...", 0.1f)
                      FileOutputStream(outputPak).use { fos ->
                          files.forEachIndexed { index, file ->
                              val relPath = file.relativeTo(sourceDir).path
                              onProgress("Compressing: $relPath", 0.1f + ((index.toFloat() / files.size) * 0.75f))
                              file.inputStream().use { it.copyTo(fos) }
                          }

                          val trailer = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                          trailer.putLong(0L)
                          trailer.putLong(files.size.toLong())
                          trailer.putLong(0L)
                          trailer.putInt(PAK_MAGIC.toInt())
                          fos.write(trailer.array())
                      }
                      onProgress("✅ Repack complete: ${outputPak.name} (${outputPak.length()} bytes)", 1.0f)
                      true
                  } catch (e: Exception) {
                      onProgress("❌ Repack failed: ${e.message}", 0f)
                      false
                  }
              }
          }
          EOF

          # ---------- ui/theme/Theme.kt ----------
          cat > app/src/main/java/com/rjtool/app/ui/theme/Theme.kt <<'EOF'
