      - name: Commit and Push Fully Working Sources with 10 arm64-v8a Native Libs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix jni.h missing header and pack all 10 arm64-v8a native libs [skip ci]" || echo "No changes"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Executable Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RJTOOL-v1.0.59-NativeBuilt-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
