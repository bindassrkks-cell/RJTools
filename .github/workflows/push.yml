              var isProcessing by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(DarkBackground)
                      .padding(horizontal = 20.dp, vertical = 16.dp)
                      .verticalScroll(rememberScrollState())
              ) {
                  TopHeader()
                  Spacer(modifier = Modifier.height(20.dp))
                  Row(
                      modifier = Modifier.clickable { navController.popBackStack() }.padding(vertical = 4.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Icon(Icons.AutoMirrored.Filled.ArrowBackIos, "Back", tint = AccentTeal, modifier = Modifier.size(15.dp))
                      Spacer(modifier = Modifier.width(4.dp))
                      Text("Back", color = AccentTeal, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  Text("Size Fixer", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = TextPrimary)
                  Text("Pad file to exact required size", fontSize = 14.sp, color = TextSecondary)
                  Spacer(modifier = Modifier.height(20.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = DarkCardBg),
                      shape = RoundedCornerShape(16.dp)
                  ) {
                      Column(modifier = Modifier.padding(18.dp)) {
                          Text("Workspace files in RESULT_PAK or EDITTED", fontWeight = FontWeight.Bold, color = TextPrimary)
                          Spacer(modifier = Modifier.height(8.dp))
                          OutlinedTextField(
                              value = filenameInput,
                              onValueChange = { filenameInput = it },
                              label = { Text("Filename (e.g. repacked.pak)") },
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = targetSizeInput,
                              onValueChange = { targetSizeInput = it },
                              label = { Text("Target Size (e.g. 15.01M)") },
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          val trimmed = targetSizeInput.trim().uppercase()
                          val targetBytes = when {
                              trimmed.endsWith("MB") -> (trimmed.removeSuffix("MB").toDoubleOrNull() ?: 0.0) * 1024 * 1024
                              trimmed.endsWith("M") -> (trimmed.removeSuffix("M").toDoubleOrNull() ?: 0.0) * 1024 * 1024
                              trimmed.endsWith("KB") -> (trimmed.removeSuffix("KB").toDoubleOrNull() ?: 0.0) * 1024
                              trimmed.endsWith("K") -> (trimmed.removeSuffix("K").toDoubleOrNull() ?: 0.0) * 1024
                              else -> trimmed.toDoubleOrNull() ?: 0.0
                          }.toLong()

                          val candidateFiles = listOf(
                              File(FileUtils.ROOT_DIR, "RESULT_PAK/$filenameInput"),
                              File(FileUtils.ROOT_DIR, "EDITTED/$filenameInput"),
                              File(FileUtils.ROOT_DIR, filenameInput)
                          )
                          val target = candidateFiles.firstOrNull { it.exists() && it.isFile }
                          if (target == null) {
                              logMessage += "❌ File $filenameInput not found in RJTOOL folders!\n"
                              return@Button
                          }

                          isProcessing = true
                          scope.launch {
                              withContext(Dispatchers.IO) {
                                  val oldLen = target.length()
                                  RandomAccessFile(target, "rw").use { it.setLength(targetBytes) }
                                  logMessage += "Fixed: ${target.name}\nOld: $oldLen B -> New: ${target.length()} B\n"
                              }
                              isProcessing = false
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = ButtonGreen),
                      shape = RoundedCornerShape(10.dp),
                      enabled = !isProcessing
                  ) {
                      Text("Apply Exact Size", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = TextPrimary)
                  }

                  if (logMessage.isNotEmpty()) {
                      Spacer(modifier = Modifier.height(16.dp))
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = DarkSurface),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Text(text = logMessage, color = AccentTeal, fontFamily = FontFamily.Monospace, fontSize = 12.sp, modifier = Modifier.padding(14.dp))
                      }
                  }
              }
          }
          EOF

          # ---------- ui/screens/HexEditorScreen.kt (Dark Theme Paginated Viewer) ----------
          cat > app/src/main/java/com/rjtool/app/ui/screens/HexEditorScreen.kt <<'EOF'
          package com.rjtool.app.ui.screens

          import android.widget.Toast
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBackIos
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.navigation.NavController
          import com.rjtool.app.ui.components.TopHeader
          import com.rjtool.app.ui.theme.*
          import com.rjtool.app.utils.FileUtils
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.RandomAccessFile

          data class HexRow(val offset: Long, val bytes: List<Byte>, val ascii: String)

          @Composable
          fun HexEditorScreen(navController: NavController) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var filenameInput by remember { mutableStateOf("index.csv") }
              var currentOffset by remember { mutableStateOf(0L) }
              var rows by remember { mutableStateOf<List<HexRow>>(emptyList()) }
              var editOffsetStr by remember { mutableStateOf("") }
              var editByteHexStr by remember { mutableStateOf("") }

              fun loadPage(offset: Long) {
                  scope.launch {
                      withContext(Dispatchers.IO) {
                          val file = File(FileUtils.ROOT_DIR, filenameInput)
                          if (!file.exists()) return@withContext
                          RandomAccessFile(file, "r").use { raf ->
                              raf.seek(offset)
                              val buffer = ByteArray(256)
                              val read = raf.read(buffer)
                              val newRows = mutableListOf<HexRow>()
                              if (read > 0) {
                                  for (i in 0 until read step 16) {
                                      val chunk = buffer.slice(i until minOf(i + 16, read))
                                      val ascii = chunk.map { b -> if (b in 32..126) b.toInt().toChar() else '.' }.joinToString("")
                                      newRows.add(HexRow(offset + i, chunk, ascii))
                                  }
                              }
                              rows = newRows
                              currentOffset = offset
                          }
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(DarkBackground)
                      .padding(horizontal = 16.dp, vertical = 12.dp)
              ) {
                  TopHeader()
                  Spacer(modifier = Modifier.height(10.dp))
                  Row(
                      modifier = Modifier.clickable { navController.popBackStack() }.padding(vertical = 4.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Icon(Icons.AutoMirrored.Filled.ArrowBackIos, "Back", tint = AccentTeal, modifier = Modifier.size(15.dp))
                      Spacer(modifier = Modifier.width(4.dp))
                      Text("Back", color = AccentTeal, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  }
                  Spacer(modifier = Modifier.height(6.dp))
                  Text("Hex Editor", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = TextPrimary)
                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = filenameInput,
                          onValueChange = { filenameInput = it },
                          label = { Text("File in RJTOOL") },
                          modifier = Modifier.weight(1f),
                          singleLine = true
                      )
                      Button(
                          onClick = { loadPage(0L) },
                          colors = ButtonDefaults.buttonColors(containerColor = ButtonGreen)
                      ) {
                          Text("Load")
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = editOffsetStr,
                          onValueChange = { editOffsetStr = it },
                          label = { Text("Offset (Hex)") },
                          modifier = Modifier.weight(1f),
                          singleLine = true
                      )
                      OutlinedTextField(
                          value = editByteHexStr,
                          onValueChange = { editByteHexStr = it },
                          label = { Text("Byte (Hex)") },
                          modifier = Modifier.weight(1f),
                          singleLine = true
                      )
                      Button(
                          onClick = {
                              scope.launch {
                                  try {
                                      val off = editOffsetStr.toLong(16)
                                      val byteVal = editByteHexStr.toInt(16).toByte()
                                      val file = File(FileUtils.ROOT_DIR, filenameInput)
                                      withContext(Dispatchers.IO) {
                                          RandomAccessFile(file, "rw").use { raf ->
                                              raf.seek(off)
                                              raf.write(byteArrayOf(byteVal))
                                          }
                                      }
                                      Toast.makeText(context, "Byte saved to disk!", Toast.LENGTH_SHORT).show()
                                      loadPage(currentOffset)
                                  } catch (e: Exception) {
                                      Toast.makeText(context, "Edit failed: ${e.message}", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = AccentTeal)
                      ) {
                          Text("Save")
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  Card(
                      modifier = Modifier.weight(1f).fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = DarkSurface),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      LazyColumn(modifier = Modifier.fillMaxSize().padding(8.dp)) {
                          items(rows) { row ->
                              Row(modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp)) {
                                  Text(
                                      text = "0x" + row.offset.toString(16).padStart(8, '0').uppercase(),
                                      color = Color(0xFFFFB300),
                                      fontFamily = FontFamily.Monospace,
                                      fontSize = 11.sp,
                                      modifier = Modifier.width(85.dp)
                                  )
                                  Text(
                                      text = row.bytes.joinToString(" ") { it.toUByte().toString(16).padStart(2, '0').uppercase() },
                                      color = Color(0xFF00FF66),
                                      fontFamily = FontFamily.Monospace,
                                      fontSize = 11.sp,
                                      modifier = Modifier.weight(1f)
                                  )
                                  Text(
                                      text = row.ascii,
                                      color = Color(0xFF00E5FF),
                                      fontFamily = FontFamily.Monospace,
                                      fontSize = 11.sp,
                                      modifier = Modifier.width(80.dp)
                                  )
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      OutlinedButton(onClick = { if (currentOffset >= 256) loadPage(currentOffset - 256) }) {
                          Text("<< Prev")
                      }
                      Text(
                          text = "Offset: 0x${currentOffset.toString(16).uppercase()}",
                          modifier = Modifier.align(Alignment.CenterVertically),
                          fontSize = 12.sp,
                          color = TextSecondary
                      )
                      OutlinedButton(onClick = { loadPage(currentOffset + 256) }) {
                          Text("Next >>")
                      }
                  }
              }
          }
          EOF

